events {
    worker_connections 1024;
}

http {
    upstream pob_poe1_backend {
        # Route PoE1 requests to the PoE1 pod set, preferring the replica with
        # the fewest active connections.
        least_conn;

        # Docker DNS resolves this service name to all matching replicas.
        # Keep max_fails disabled so nginx does not temporarily drop the only
        # visible target and emit "no live upstreams".
        server pob1-pod:8080 max_fails=0;
    }

    upstream pob_poe2_backend {
        # Route PoE2 requests to the PoE2 pod set, preferring the replica with
        # the fewest active connections.
        least_conn;

        server pob2-pod:8080 max_fails=0;
    }

    server {
        listen 8080;

        location /poe1/ {
            rewrite ^/poe1/(.*)$ /$1 break;
            proxy_pass http://pob_poe1_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Disable connection reuse so requests keep distributing across pods.
            proxy_buffering off;
            keepalive_timeout 0;
        }

        location /poe2/ {
            rewrite ^/poe2/(.*)$ /$1 break;
            proxy_pass http://pob_poe2_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            keepalive_timeout 0;
        }
    }
}
