services:
  watchtower:
    image: nickfedor/watchtower:1.14.0
    restart: unless-stopped
    container_name: watchtower
    env_file:
      - .env
    environment:
      - "WATCHTOWER_NOTIFICATIONS=shoutrrr"
      - "WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL}"
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
    command:
      - "--http-api-update"
      - "--rolling-restart"
      - "--label-enable"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - network

  reverse-proxy:
    image: nginx:1.29.4-alpine-slim
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    container_name: reverse-proxy
    restart: always
    # Reload periodically so certificates renewed by the certbot service get picked up.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - network
    depends_on:
      backend:
        condition: service_healthy
      watchtower:
        condition: service_started

  # Renews the Let's Encrypt certificate via the webroot method: challenge files are
  # written to certbot_webroot and served by reverse-proxy on port 80.
  # `certbot renew` is a no-op until the cert is within 30 days of expiry.
  certbot:
    image: certbot/certbot:v5.1.0
    container_name: certbot
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --cert-name bpl-poe.com --webroot -w /var/www/certbot
          sleep 12h & wait $$!
        done
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - network
    depends_on:
      reverse-proxy:
        condition: service_started

  backend:
    image: ghcr.io/bpl-v2/backend:1.0.2
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    container_name: backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000 || exit 1"]
      interval: 5s
      timeout: 1s
      retries: 1
    networks:
      - network

  frontend:
    image: ghcr.io/bpl-v2/frontend:1.0.0
    restart: unless-stopped
    container_name: frontend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - network

  discord-bot:
    image: ghcr.io/bpl-v2/discord-bot:0.0.0
    restart: unless-stopped
    container_name: discord-bot
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - .env:/app/.env
    networks:
      - network
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: timescale/timescaledb:2.20.3-pg17
    container_name: db
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - TIMESCALEDB_TELEMETRY=off
      - POSTGRESQL_CONF_shared_preload_libraries=timescaledb
    env_file: .env
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 1s
      retries: 1
    networks:
      - network

  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    restart: unless-stopped
    volumes:
      - kafka_data:/opt/kafka/data
    networks:
      - network
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /opt/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      # Default retention for every topic (KAFKA_AUTO_CREATE_TOPICS_ENABLE is on,
      # so most topics are created implicitly with these settings). One week of
      # time-based retention; the bytes cap is a runaway guard, not a normal
      # limit - a single partition growing past 20 GiB means something is wrong.
      # Per-topic overrides via kafka-configs.sh still win over these.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 21474836480
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - network

  loki:
    image: grafana/loki:3.4
    restart: unless-stopped
    container_name: loki
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost/monitoring/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    env_file: .env
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    networks:
      - network

  promtail:
    image: grafana/promtail:3.4
    restart: unless-stopped
    container_name: promtail
    user: "0:0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    env_file:
      - .env
    links:
      - db
      - prometheus
    networks:
      - network
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    container_name: node-exporter
    networks:
      - network

  # Exposes topic offsets and consumer-group lag (kafka_consumergroup_lag) on :9308.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    command: --kafka.server=kafka:9092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    networks:
      - network

  # Single image serving both games: /poe1/* and /poe2/* on port 8080.
  # It keeps a shared pool of pre-warmed PoB workers; each warm worker is a
  # full PoB process (~800MiB RSS), so POB_WORKERS drives the memory budget.
  # Idle workers shut down after POB_IDLE_TIMEOUT_SEC without requests.
  pob-server:
    image: ghcr.io/bpl-v2/pob-server:latest
    restart: unless-stopped
    container_name: pob-server
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 1s
      retries: 1
    mem_limit: 3GB
    cpus: 3
    networks:
      - network
    ports:
      - "8080:8080"

volumes:
  db_data:
  prometheus_data:
  loki_data:
  grafana_data:
  kafka_data:
  certbot_webroot:

networks:
  network:
